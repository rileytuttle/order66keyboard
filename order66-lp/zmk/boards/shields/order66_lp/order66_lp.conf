# Mouse keys (&mmv / &msc / &mkp) and the Cirque trackpad both need this.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- trackpad -------------------------------------------------------------------
# Cirque GlidePoint TM040040 on I2C. The nice!nano already pins &i2c0 to P0.17/P0.20,
# which is where the schematic puts TP_SDA/TP_SCL, so no pinctrl override is needed.
# Remember the module ships strapped for SPI -- its R1 must be removed.
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Carried over from the v1.0 board.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=86400000

# --- backlight -------------------------------------------------------------------
# 60 SK6812MINI-E at full white is around 3.4 A / 17 W, which a pouch cell cannot
# deliver and the 2 A boost is not sized for. BRT_MAX caps what the firmware will
# ever ask for; raise it only if you are on USB and have measured the rail.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# Ties the LED rail to ZMK external power, which on nice!nano v2 is the VCC rail on
# P0.13. The hardware gates Q1 (and so the boost, the LEDs and the level shifter)
# from VCC, so turning underglow off actually removes power rather than sending
# "all black" to 60 LEDs that keep drawing ~1 mA each.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Start with a solid colour rather than an animation.
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# --- ZMK Studio ----------------------------------------------------------------
# Lets you edit the keymap live over USB instead of rebuilding. Needs the shared
# physical layout and a matrix transform, which this shield has. Locking is implied
# on, so the keymap binds &studio_unlock (ADJUST layer, left of the home row).
#
# Enabling it takes a build snippet as well as this symbol, so it is not set here.
# The Nix build turns it on already via `enableZmkStudio = true` in flake.nix.
# For a manual west build, uncomment the line below and add the snippet:
#   west build -p -b 'nice_nano//zmk' -S studio-rpc-usb-uart -- -DSHIELD=order66_lp ...
# CONFIG_ZMK_STUDIO=y
